name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 尝试装配打包模型(可选,无模型时跳过)
        run: node tools/stage-models.mjs --slim || echo "无模型源,跳过"
        continue-on-error: true

      - name: 构建安装包
        run: npm run tauri build

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p artifact
          cp "src-tauri/target/release/bundle/nsis/"*-setup.exe artifact/
          cp src-tauri/target/release/qpp-studio.exe artifact/qpp-studio-portable.exe
          cd artifact && ls -la

      - name: 上传产物(每次构建可见)
        uses: actions/upload-artifact@v4
        with:
          name: qpp-studio-windows
          path: artifact/

      - name: 附到 GitHub Release(仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          generate_release_notes: true

  # macOS(Apple Silicon):原生 arm64 runner。未签名 dmg(右键打开绕 Gatekeeper),
  # 公证/正式签名留待后续接 APPLE_CERTIFICATE secrets。
  # workflow_dispatch 手动触发用于 mac 移植调试:只出 artifact,不发 Release。
  build-macos:
    name: 构建 macOS dmg(Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 尝试装配打包模型(可选,无模型时跳过)
        run: node tools/stage-models.mjs --slim || echo "无模型源,跳过"
        continue-on-error: true

      - name: 校验 pdfium dylib(入库文件)
        run: ls -la src-tauri/models-bundle/libpdfium.dylib

      - name: 构建安装包
        run: npm run tauri build

      - name: 整理产物
        run: |
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/QPP Studio.app" \
            "artifact/QPP-Studio-macos-arm64.app.zip"
          cp src-tauri/target/release/bundle/dmg/*.dmg artifact/
          cd artifact && ls -la

      - name: 上传产物(每次构建可见)
        uses: actions/upload-artifact@v4
        with:
          name: qpp-studio-macos-arm64
          path: artifact/

      - name: 附到 GitHub Release(仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*
          generate_release_notes: true
