name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 尝试装配打包模型(可选,无模型时跳过)
        run: node tools/stage-models.mjs --slim || echo "无模型源,跳过"
        continue-on-error: true

      - name: 构建安装包
        run: npm run tauri build

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p artifact
          cp "src-tauri/target/release/bundle/nsis/"*-setup.exe artifact/
          # 便携版:裸 release exe 旁没有打包 resources(models/pdfium 都缺),
          # 必须组装 exe + models + pdfium.dll 再压缩,否则引擎起不来、PDF 全废
          mkdir -p portable/models
          cp src-tauri/target/release/qpp-studio.exe portable/
          cp -r src-tauri/models-bundle/models/. portable/models/
          cp src-tauri/models-bundle/pdfium.dll portable/
          powershell -NoProfile -Command "Compress-Archive -Path portable -DestinationPath artifact/qpp-studio-portable-windows-x64.zip"
          cd artifact && ls -la

      - name: 上传产物(每次构建可见)
        uses: actions/upload-artifact@v4
        with:
          name: qpp-studio-windows
          path: artifact/

  # macOS(Apple Silicon):原生 arm64 runner。未签名 dmg(右键打开绕 Gatekeeper),
  # 公证/正式签名留待后续接 APPLE_CERTIFICATE secrets。
  # workflow_dispatch 手动触发用于 mac 移植调试:只出 artifact,不发 Release。
  build-macos:
    name: 构建 macOS dmg(Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 尝试装配打包模型(可选,无模型时跳过)
        run: node tools/stage-models.mjs --slim || echo "无模型源,跳过"
        continue-on-error: true

      - name: 校验 pdfium dylib(入库文件)
        run: ls -la src-tauri/models-bundle/libpdfium.dylib

      - name: 构建安装包
        run: npm run tauri build

      - name: 整理产物
        run: |
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/QPP Studio.app" \
            "artifact/QPP-Studio-macos-arm64.app.zip"
          cp src-tauri/target/release/bundle/dmg/*.dmg artifact/
          cd artifact && ls -la

      - name: 上传产物(每次构建可见)
        uses: actions/upload-artifact@v4
        with:
          name: qpp-studio-macos-arm64
          path: artifact/

  # Release 只由这一个 job 写:原先两个 build job 各自带 generate_release_notes,
  # 同一个 Release 的正文被生成两遍并叠加(v0.3.0 实际就是这样发出去的)。
  # 收敛成单一写入者后,正文与附件都不再有竞争,也不必依赖 action
  # 在「更新已有 Release」时的具体行为。
  # tag 之外(workflow_dispatch 调试)整个 job 跳过,保持「手动触发只出 artifact」。
  publish:
    name: 发布 Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 取回两个平台的产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 建 Release 并附上全部产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
